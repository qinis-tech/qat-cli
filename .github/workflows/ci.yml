# name: CI

# # ─────────────────────────────────────────────────────────────────────────────
# # Triggers
# #
# # Three, each with a reason:
# #
# #   pull_request → main   Every proposed change is verified before review, so a
# #                         reviewer never spends time on a branch that cannot pass.
# #   push → main           A merge is verified again. This catches the case where
# #                         two independently-green branches conflict semantically
# #                         but merge cleanly, and it is the run branch protection
# #                         and release automation can trust.
# #   workflow_dispatch     Manual re-run after an infrastructure incident or a
# #                         runner image change, without pushing a commit.
# #
# # Deliberately NOT `push: branches: ['**']`. Combined with pull_request that would
# # run every PR twice — once for the branch push, once for the PR event — doubling
# # cost for no additional signal.
# # ─────────────────────────────────────────────────────────────────────────────
# on:
#   pull_request:
#     branches: [main]
#   push:
#     branches: [main]
#   workflow_dispatch:

# # ─────────────────────────────────────────────────────────────────────────────
# # Permissions
# #
# # Least privilege: the workflow reads code and writes nothing. GITHUB_TOKEN gets
# # `contents: read` and every other scope is `none`.
# #
# # Artifact upload does not use GITHUB_TOKEN — it uses the Actions runtime token —
# # so it needs no additional scope here.
# #
# # A compromised third-party action therefore cannot push a commit, publish a
# # release, or modify an issue with the credentials this workflow carries.
# # ─────────────────────────────────────────────────────────────────────────────
# permissions:
#   contents: read

# # ─────────────────────────────────────────────────────────────────────────────
# # Concurrency
# #
# # A newer commit on the same ref makes the older run's answer irrelevant.
# #
# # Cancel only pull requests. Cancelling a push run on `main` would delete the
# # record of what was verified on the branch that ships, which is precisely the
# # run an auditor or a release job needs to see complete.
# # ─────────────────────────────────────────────────────────────────────────────
# concurrency:
#   group: ci-${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# env:
#   # npm's update notifier and funding banner add noise to logs and can interleave
#   # with output that later tooling parses.
#   npm_config_update_notifier: 'false'
#   npm_config_fund: 'false'
#   npm_config_audit: 'false'

